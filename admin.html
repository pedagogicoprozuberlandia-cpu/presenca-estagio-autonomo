<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Coordenação – Presenças Estágio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #6B3FA0 0%, #a0500a 60%, #F47920 100%); min-height: 100vh; background-attachment: fixed; }
    .topbar { background: rgba(10, 5, 20, 0.85); color: white; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .topbar h1 { font-size: 1.1rem; font-weight: 600; }
    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
    .login-card { background: white; border-radius: 16px; padding: 36px 32px; max-width: 380px; margin: 60px auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h2 { margin-bottom: 20px; color: #1a1a2e; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #333; margin-bottom: 6px; }
    input, select { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-size: 0.95rem; margin-bottom: 14px; background: white; }
    input:focus, select:focus { outline: none; border-color: #1565c0; }
    .btn { padding: 11px 20px; background: #1565c0; color: white; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #0d47a1; }
    .btn-red { background: #c62828; } .btn-red:hover { background: #b71c1c; }
    .btn-green { background: #2e7d32; } .btn-green:hover { background: #1b5e20; }
    .btn-full { width: 100%; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; margin-bottom: 20px; }
    .stat-card { background: white; border-radius: 12px; padding: 18px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: #1565c0; }
    .stat-card .lbl { font-size: 0.8rem; color: #777; margin-top: 4px; }
    .filters { background: white; border-radius: 12px; padding: 18px 20px; margin-bottom: 18px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .filters .f { display: flex; flex-direction: column; gap: 4px; }
    .filters label { margin-bottom: 0; }
    .filters input, .filters select { margin-bottom: 0; min-width: 140px; }
    .table-wrap { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); overflow: hidden; }
    .table-header { padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eee; flex-wrap: wrap; gap: 10px; }
    .table-header h2 { font-size: 1rem; color: #1a1a2e; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f5f7fa; text-align: left; padding: 10px 14px; font-size: 0.78rem; color: #666; font-weight: 600; text-transform: uppercase; }
    td { padding: 10px 14px; font-size: 0.87rem; color: #333; border-top: 1px solid #f0f0f0; vertical-align: middle; }
    tr:hover td { background: #fafbfc; }
    .badge-ilpi { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; background: #e3f2fd; color: #1565c0; }
    .empty { text-align: center; padding: 40px; color: #aaa; }
    .msg { padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-top: 10px; display: none; }
    .msg.error { background: #ffebee; color: #c62828; display: block; }
    #painel { display: none; }
    .acoes { display: flex; gap: 6px; }
    .btn-editar { padding: 5px 12px; background: #f57f17; color: white; border: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-editar:hover { background: #e65100; }
    .btn-excluir { padding: 5px 12px; background: #c62828; color: white; border: none; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .btn-excluir:hover { background: #b71c1c; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 14px; padding: 28px; max-width: 420px; width: 90%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin-bottom: 16px; color: #1a1a2e; }
    .modal label { display: block; font-size: 0.83rem; font-weight: 600; color: #333; margin-bottom: 4px; margin-top: 12px; }
    .modal input, .modal select { width: 100%; padding: 9px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 0.9rem; background: white; margin-bottom: 0; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .modal-btns button { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .modal-msg { padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; margin-top: 10px; display: none; }
    .modal-msg.error { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>
<body>

<div id="login-admin">
  <div class="login-card">
    <h2>🔐 Coordenação</h2>
    <label>Senha de acesso</label>
    <input type="password" id="senha-admin" placeholder="Digite a senha" />
    <button class="btn btn-full" onclick="loginAdmin()">Entrar</button>
    <div class="msg" id="msg-login"></div>
    <p style="margin-top:16px;font-size:0.8rem;color:#999;text-align:center">
      <a href="index.html" style="color:#1565c0;text-decoration:none">← Voltar ao registro</a>
    </p>
  </div>
</div>

<div id="painel">
  <div class="topbar">
    <h1>📋 Presenças Estágio – Coordenação PROZ</h1>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <span id="ultimo-update" style="font-size:0.82rem;color:#aaa;align-self:center"></span>
      <button class="btn btn-green" onclick="exportarExcel()" style="padding:8px 14px;font-size:0.82rem;">⬇ Exportar Excel</button>
      <a href="alunos.html" style="padding:8px 14px;font-size:0.82rem;background:#455a64;color:white;border-radius:10px;text-decoration:none;">👥 Alunos</a>
      <a href="locais.html" style="padding:8px 14px;font-size:0.82rem;background:#2e7d32;color:white;border-radius:10px;text-decoration:none;">📍 Locais</a>
      <button class="btn btn-red" onclick="sairAdmin()" style="padding:8px 14px;font-size:0.82rem;">Sair</button>
    </div>
  </div>

  <div class="container">
    <div class="stats">
      <div class="stat-card"><div class="num" id="stat-hoje">-</div><div class="lbl">Presenças hoje</div></div>
      <div class="stat-card"><div class="num" id="stat-alunos">-</div><div class="lbl">Alunos hoje</div></div>
      <div class="stat-card"><div class="num" id="stat-mes">-</div><div class="lbl">Presenças no mês</div></div>
      <div class="stat-card"><div class="num" id="stat-horas">-</div><div class="lbl">Total horas no mês</div></div>
    </div>

    <div class="filters">
      <div class="f"><label>Data inicial</label><input type="date" id="f-ini" /></div>
      <div class="f"><label>Data final</label><input type="date" id="f-fim" /></div>
      <div class="f">
        <label>Campo de Estágio</label>
        <select id="f-ilpi"><option value="">Todas</option></select>
      </div>
      <div class="f"><label>Aluno</label><input type="text" id="f-aluno" placeholder="Buscar nome..." /></div>
      <div class="f" style="justify-content:flex-end"><button class="btn" onclick="carregar()">🔍 Filtrar</button></div>
    </div>

    <div class="table-wrap">
      <div class="table-header">
        <h2>Registros de Presença</h2>
        <span style="font-size:0.82rem;color:#888" id="total-label"></span>
      </div>
      <div id="tabela-container"><div class="empty">Carregando...</div></div>
    </div>
  </div>
</div>

<!-- Modal Editar -->
<div class="modal-overlay" id="modal-editar">
  <div class="modal">
    <h3>✏️ Editar Registro</h3>
    <input type="hidden" id="edit-id" />
    <label>Aluno</label>
    <input type="text" id="edit-aluno" />
    <label>CPF</label>
    <input type="text" id="edit-cpf" inputmode="numeric" maxlength="11" />
    <label>Campo de Estágio</label>
    <select id="edit-local"></select>
    <label>Data</label>
    <input type="date" id="edit-data" />
    <label>Horário</label>
    <input type="time" id="edit-horario" />
    <label>Carga Horária</label>
    <input type="text" id="edit-carga" placeholder="Ex: 6h00min" />
    <div class="modal-msg" id="modal-editar-msg"></div>
    <div class="modal-btns">
      <button onclick="fecharModal('modal-editar')" style="background:white;color:#1565c0;border:1.5px solid #1565c0;">Cancelar</button>
      <button onclick="salvarEdicao()" style="background:#2e7d32;color:white;">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal Excluir -->
<div class="modal-overlay" id="modal-excluir">
  <div class="modal" style="text-align:center;max-width:360px;">
    <h3>⚠️ Excluir Registro</h3>
    <p id="modal-excluir-texto" style="color:#555;font-size:0.9rem;margin:16px 0 20px;"></p>
    <div class="modal-btns">
      <button onclick="fecharModal('modal-excluir')" style="background:white;color:#1565c0;border:1.5px solid #1565c0;">Cancelar</button>
      <button onclick="confirmarExclusao()" style="background:#c62828;color:white;">Excluir</button>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://popryznbbmzbzaowfeoc.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBvcHJ5em5iYm16Ynphb3dmZW9jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MDI3NDcsImV4cCI6MjA5Nzk3ODc0N30.xkPhLr-76Vtdo5yTC4hJRg52aM4-8bwQyGBqtzouJKE';
  const SENHA_ADMIN = '1234';

  let todosRegistros = [];
  let locaisAdmin = [];
  let registroParaExcluir = null;

  // ── AUTH ──────────────────────────
  function loginAdmin() {
    if (document.getElementById('senha-admin').value === SENHA_ADMIN) {
      sessionStorage.setItem('coordenacao_auth', '1');
      document.getElementById('login-admin').style.display = 'none';
      document.getElementById('painel').style.display = 'block';
      iniciar();
    } else {
      const msg = document.getElementById('msg-login');
      msg.className = 'msg error'; msg.textContent = 'Senha incorreta.';
    }
  }
  document.getElementById('senha-admin').addEventListener('keydown', e => { if(e.key==='Enter') loginAdmin(); });

  function sairAdmin() {
    sessionStorage.removeItem('coordenacao_auth');
    document.getElementById('login-admin').style.display = 'block';
    document.getElementById('painel').style.display = 'none';
    document.getElementById('senha-admin').value = '';
  }

  // ── SUPABASE ──────────────────────
  async function supabaseFetch(path, options = {}) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation', ...options.headers },
      ...options
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || JSON.stringify(data));
    return data;
  }

  // ── INICIAR ───────────────────────
  async function iniciar() {
    const hoje = new Date().toISOString().split('T')[0];
    document.getElementById('f-ini').value = hoje.slice(0,8) + '01';
    document.getElementById('f-fim').value = hoje;
    await carregarFiltroLocais();
    carregar();
    setInterval(carregar, 60000);
  }

  async function carregarFiltroLocais() {
    try {
      locaisAdmin = await supabaseFetch('/locais_ilpi?ativo=eq.true&order=nome.asc');
      const sel = document.getElementById('f-ilpi');
      sel.innerHTML = '<option value="">Todas</option>' +
        locaisAdmin.map(l => `<option value="${l.id}">${l.nome}</option>`).join('');
    } catch(e) {}
  }

  // ── CARREGAR REGISTROS ────────────
  async function carregar() {
    const ini = document.getElementById('f-ini').value;
    const fim = document.getElementById('f-fim').value;
    const ilpi = document.getElementById('f-ilpi').value;
    const aluno = document.getElementById('f-aluno').value.trim();

    let q = `/presencas_ilpi?order=data.desc,horario.desc`;
    if (ini) q += `&data=gte.${ini}`;
    if (fim) q += `&data=lte.${fim}`;
    if (ilpi) q += `&ilpi=eq.${ilpi}`;
    if (aluno) q += `&aluno_nome=ilike.*${encodeURIComponent(aluno)}*`;

    const data = await supabaseFetch(q);
    todosRegistros = data;
    renderTabela(data);
    calcularStats();
    document.getElementById('ultimo-update').textContent = 'Atualizado: ' + new Date().toLocaleTimeString('pt-BR');
  }

  function calcularStats() {
    const hoje = new Date().toISOString().split('T')[0];
    const mes = hoje.slice(0,7);
    const hojeRegs = todosRegistros.filter(r => r.data === hoje);
    const mesRegs = todosRegistros.filter(r => r.data && r.data.startsWith(mes));

    let totalMin = 0;
    mesRegs.forEach(r => {
      if (r.carga_horaria) {
        const m = r.carga_horaria.match(/(\d+)h(\d+)/);
        if (m) totalMin += parseInt(m[1]) * 60 + parseInt(m[2]);
      }
    });
    const th = Math.floor(totalMin / 60), tm = totalMin % 60;

    document.getElementById('stat-hoje').textContent = hojeRegs.length;
    document.getElementById('stat-alunos').textContent = new Set(hojeRegs.map(r => r.aluno_id)).size;
    document.getElementById('stat-mes').textContent = mesRegs.length;
    document.getElementById('stat-horas').textContent = `${th}h${String(tm).padStart(2,'0')}`;
  }

  function renderTabela(data) {
    document.getElementById('total-label').textContent = `${data.length} registro(s)`;
    const cont = document.getElementById('tabela-container');
    if (!data.length) { cont.innerHTML = '<div class="empty">Nenhum registro encontrado.</div>'; return; }

    const rows = data.map(r => {
      const dt = r.data ? r.data.split('-').reverse().join('/') : '-';
      const cpfFmt = r.cpf ? r.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : '-';
      const horas = r.carga_horaria ? `<strong>${r.carga_horaria}</strong>` : '-';
      // Escapar aspas simples no nome para não quebrar o onclick
      const nomeEsc = (r.aluno_nome || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      return `<tr>
        <td>${dt}</td>
        <td>${r.horario || '-'}</td>
        <td><strong>${r.aluno_nome || '-'}</strong></td>
        <td>${cpfFmt}</td>
        <td><span class="badge-ilpi">${r.ilpi_nome || '-'}</span></td>
        <td>${horas}</td>
        <td>
          <div class="acoes">
            <button class="btn-editar" onclick="abrirEditar('${r.id}')">✏️ Editar</button>
            <button class="btn-excluir" onclick="abrirExcluir('${r.id}','${nomeEsc}','${dt}')">🗑 Excluir</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    cont.innerHTML = `<table>
      <thead><tr>
        <th>Data</th><th>Horário</th><th>Aluno</th><th>CPF</th><th>Campo de Estágio</th><th>C. Horária</th><th>Ações</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  }

  // ── EDITAR ────────────────────────
  async function abrirEditar(id) {
    const r = todosRegistros.find(x => x.id === id);
    if (!r) return;

    document.getElementById('edit-id').value = id;
    document.getElementById('edit-aluno').value = r.aluno_nome || '';
    document.getElementById('edit-cpf').value = r.cpf || '';
    document.getElementById('edit-data').value = r.data || '';
    document.getElementById('edit-horario').value = r.horario || '';
    document.getElementById('edit-carga').value = r.carga_horaria || '';

    const sel = document.getElementById('edit-local');
    if (!locaisAdmin.length) await carregarFiltroLocais();
    sel.innerHTML = locaisAdmin.map(l =>
      `<option value="${l.id}" ${l.id === r.ilpi ? 'selected' : ''}>${l.nome}</option>`
    ).join('');

    document.getElementById('modal-editar-msg').style.display = 'none';
    document.getElementById('modal-editar').classList.add('active');
  }

  async function salvarEdicao() {
    const id = document.getElementById('edit-id').value;
    const aluno_nome = document.getElementById('edit-aluno').value.trim();
    const cpf = document.getElementById('edit-cpf').value.trim().replace(/\D/g,'');
    const localSel = document.getElementById('edit-local');
    const ilpi = localSel.value;
    const ilpi_nome = localSel.options[localSel.selectedIndex].text;
    const data = document.getElementById('edit-data').value;
    const horario = document.getElementById('edit-horario').value;
    const carga_horaria = document.getElementById('edit-carga').value.trim();
    const msg = document.getElementById('modal-editar-msg');

    if (!aluno_nome || !data || !horario) {
      msg.className = 'modal-msg error'; msg.textContent = 'Preencha nome, data e horário.'; return;
    }

    try {
      await supabaseFetch(`/presencas_ilpi?id=eq.${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ aluno_nome, cpf, ilpi, ilpi_nome, data, horario, carga_horaria })
      });
      fecharModal('modal-editar');
      carregar();
    } catch(e) {
      msg.className = 'modal-msg error'; msg.textContent = 'Erro ao salvar. Tente novamente.';
    }
  }

  // ── EXCLUIR ───────────────────────
  function abrirExcluir(id, aluno, data) {
    registroParaExcluir = id;
    document.getElementById('modal-excluir-texto').textContent =
      `Tem certeza que deseja excluir o registro de "${aluno}" em ${data}?`;
    document.getElementById('modal-excluir').classList.add('active');
  }

  async function confirmarExclusao() {
    try {
      await supabaseFetch(`/presencas_ilpi?id=eq.${registroParaExcluir}`, { method: 'DELETE' });
      fecharModal('modal-excluir');
      carregar();
    } catch(e) { alert('Erro ao excluir. Tente novamente.'); }
  }

  // ── MODAIS ────────────────────────
  function fecharModal(id) {
    document.getElementById(id).classList.remove('active');
    registroParaExcluir = null;
  }
  document.querySelectorAll('.modal-overlay').forEach(m =>
    m.addEventListener('click', function(e) { if(e.target===this) this.classList.remove('active'); })
  );

  // Verificar sessão ao carregar (após todas as funções estarem declaradas)
  if (sessionStorage.getItem('coordenacao_auth') === '1') {
    document.getElementById('login-admin').style.display = 'none';
    document.getElementById('painel').style.display = 'block';
    iniciar();
  }

  // ── EXPORTAR EXCEL ────────────────
  function exportarExcel() {
    if (!todosRegistros.length) { alert('Nenhum dado para exportar.'); return; }
    const ws_data = [
      ['Nome do Aluno', 'CPF', 'Campo de Estágio', 'Data', 'Horário', 'Carga Horária'],
      ...todosRegistros.map(r => [
        r.aluno_nome || '',
        r.cpf ? r.cpf.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4') : '',
        r.ilpi_nome || '',
        r.data ? r.data.split('-').reverse().join('/') : '',
        r.horario || '',
        r.carga_horaria || '6h00min'
      ])
    ];
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(ws_data);
    ws['!cols'] = [30,18,22,12,10,14].map(w => ({wch:w}));
    XLSX.utils.book_append_sheet(wb, ws, 'Presenças');
    XLSX.writeFile(wb, `presencas_estagio_${new Date().toISOString().split('T')[0]}.xlsx`);
  }
</script>
</body>
</html>
